<!doctype html>
<html lang="tr" data-design="a">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>İrticalen — tasarım örneği</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400..600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="a-sahne.css" />
<link rel="stylesheet" href="b-afis.css" />
<link rel="stylesheet" href="c-cini.css" />
<link rel="stylesheet" href="d-cilt.css" />
<link rel="stylesheet" href="e-cini2.css" />
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main class="app" id="app">
  <header class="top">
    <a class="brand" href="#"><svg class="logo" viewBox="0 0 40 56" width="30" height="42" aria-hidden="true"><path d="M20 1.5c2.2 5 6.2 8 11 10.5 4.6 2.6 7.5 8.6 7.5 16s-2.9 13.4-7.5 16c-4.8 2.5-8.8 5.5-11 10.5-2.2-5-6.2-8-11-10.5C4.4 41.4 1.5 35.4 1.5 28S4.4 14.6 9 12c4.8-2.5 8.8-5.5 11-10.5z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M20 8c1.7 3.4 4.6 5.6 8 7.5 3.3 1.9 5.3 6.6 5.3 12.5S31.3 38.6 28 40.5c-3.4 1.9-6.3 4.1-8 7.5-1.7-3.4-4.6-5.6-8-7.5C8.7 38.6 6.7 33.9 6.7 28S8.7 17.4 12 15.5c3.4-1.9 6.3-4.1 8-7.5z" fill="none" stroke="currentColor" stroke-width=".8"/><circle cx="20" cy="17.5" r="1.9" fill="currentColor"/><path d="M17.4 22.5h5.2v.9c-1 .2-1.3.6-1.3 1.6v9c0 1 .3 1.4 1.3 1.6v.9h-5.2v-.9c1-.2 1.3-.6 1.3-1.6v-9c0-1-.3-1.4-1.3-1.6z" fill="currentColor"/></svg><svg class="logo-e" viewBox="0 0 48 48" aria-hidden="true"><g fill="#fff" stroke="#173f8a" stroke-width="2.4" stroke-linejoin="round"><rect x="8" y="8" width="32" height="32"/><rect x="8" y="8" width="32" height="32" transform="rotate(45 24 24)"/></g><rect x="9.2" y="9.2" width="29.6" height="29.6" fill="#fff"/><rect x="9.2" y="9.2" width="29.6" height="29.6" fill="#fff" transform="rotate(45 24 24)"/><path d="M24 11.5c2 3 4.5 5.5 4.5 9.5 1.5-1.5 2.5-3.5 3-6 1.5 3.5 1.2 9-1.5 12-1.6 1.8-3.7 2.7-6 2.7s-4.4-.9-6-2.7c-2.7-3-3-8.5-1.5-12 .5 2.5 1.5 4.5 3 6 0-4 2.5-6.5 4.5-9.5z" fill="#173f8a"/><path d="M23.1 29.2h1.8v7.3h-1.8z" fill="#173f8a"/><path d="M24 33.5c1.5-2.5 3.5-3.5 6-3.5-.8 2.7-2.8 4.2-6 4.5zM24 33.5c-1.5-2.5-3.5-3.5-6-3.5.8 2.7 2.8 4.2 6 4.5z" fill="#0f7f83"/><g fill="#0f7f83"><circle cx="24" cy="4.2" r="1.7"/><circle cx="24" cy="43.8" r="1.7"/><circle cx="4.2" cy="24" r="1.7"/><circle cx="43.8" cy="24" r="1.7"/></g></svg><span>İrticalen</span></a>
    <div class="top-actions">
      <button class="chip" type="button" aria-label="Dili değiştir">TR <span class="chip-dim">/ EN</span></button>
      <button class="chip icon" type="button" aria-label="Ayarlar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <div class="controls">
    <div class="modes" role="radiogroup" aria-label="Mod">
      <button type="button" role="radio" aria-checked="true">Hazırlıksız</button>
      <button type="button" role="radio" aria-checked="false">Araştırmalı</button>
    </div>
    <button class="category" type="button" aria-haspopup="listbox">
      <span>Girişimcilik</span>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

  <section class="reel" aria-live="polite">
    <p class="reel-label" id="reelLabel">Konun</p>
    <h1 class="topic" id="topic">İlk müşteri</h1>
    <p class="blurb">Hazırlık yok. Konu gelir, söz sende.</p>
  </section>

  <div class="actions">
    <button class="btn secondary" id="spin" type="button">Tekrar çevir</button>
    <button class="btn primary" id="start" type="button">1 dk sayacı başlat</button>
  </div>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Sayaç" hidden>
  <p class="ov-topic" id="ovTopic">İlk müşteri</p>
  <ol class="arc" id="arc">
    <li>Ne?</li><li>Ne olmuş yani?</li><li>Şimdi ne?</li>
  </ol>
  <div class="ring" id="ring" role="timer">
    <span class="clock" id="clock">01:00</span>
  </div>
  <p class="status" id="status">Konuş.</p>
  <button class="btn secondary" id="close" type="button">Kapat</button>
</div>

<script>
const q = new URLSearchParams(location.search);
document.documentElement.dataset.design = q.get('d') || 'a';
const topics = ['İlk müşteri','Hayır demek','Nakit oksijendir','Ortak seçmek','Tek kişilik şirket','Başarısızlık hakkı','Usta-çırak','Sermayesiz başlamak','Esnaf aklı','Güven sermayesi','Kusurlu haliyle çıkar','Yan iş tavanı'];
const $ = id => document.getElementById(id);
let idx = 0, spinning = false, iv;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

$('spin').onclick = () => {
  if (spinning) return;
  spinning = true; $('reelLabel').textContent = 'Çekiliyor…'; $('spin').textContent = 'Çevriliyor…';
  $('spin').disabled = $('start').disabled = true; $('topic').classList.add('is-spinning');
  const total = topics.length * 3 + 1 + Math.floor(Math.random() * (topics.length - 1));
  const startIdx = idx, t0 = performance.now(), dur = reduce ? 1 : 2600; let last = -1;
  (function frame(now) {
    const p = Math.min(1, (now - t0) / dur), step = Math.floor((1 - (1 - p) ** 3) * total);
    if (step !== last) { last = step; idx = (startIdx + step) % topics.length; $('topic').textContent = topics[idx]; }
    if (p < 1) return requestAnimationFrame(frame);
    spinning = false; $('reelLabel').textContent = 'Konun'; $('spin').textContent = 'Tekrar çevir';
    $('spin').disabled = $('start').disabled = false; $('topic').classList.remove('is-spinning');
    $('topic').classList.remove('landed'); void $('topic').offsetWidth; $('topic').classList.add('landed');
  })(t0);
};

function openTimer(total, startAt) {
  $('ovTopic').textContent = $('topic').textContent; $('overlay').hidden = false; $('app').inert = true;
  const end = Date.now() + startAt * 1000;
  const tick = () => {
    const left = Math.max(0, Math.ceil((end - Date.now()) / 1000)), el = total - left;
    $('clock').textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
    $('ring').style.setProperty('--p', el / total);
    [...$('arc').children].forEach((li, i) => li.classList.toggle('hit', el >= (total / 3) * i));
    if (!left) { clearInterval(iv); $('status').textContent = 'Süre.'; $('overlay').classList.add('done'); }
  };
  clearInterval(iv); $('status').textContent = 'Konuş.'; $('overlay').classList.remove('done'); tick(); iv = setInterval(tick, 100);
}
function closeTimer() { clearInterval(iv); $('overlay').hidden = true; $('app').inert = false; }
$('start').onclick = () => openTimer(60, 60);
$('close').onclick = closeTimer;
addEventListener('keydown', e => e.key === 'Escape' && closeTimer());
if (q.get('screen') === 'timer') openTimer(60, 38);
</script>
</body>
</html>
