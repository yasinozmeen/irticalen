# Weekly dependency update PRs. Nothing merges on its own: PRs run CI (.github/workflows/ci.yml)
# and wait for review; only a push to main deploys.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # astro check does not run on TypeScript 7 yet (see CLAUDE.md); stay on 6.x.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
