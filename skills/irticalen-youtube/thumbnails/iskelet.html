<!doctype html>
<!-- Şablon "iskelet": konu + konuşmanın üç adımı, işaretlenmiş hâliyle (kırmızı tikler). -->
<html><head><meta charset="utf-8"><title>iskelet</title><link rel="stylesheet" href="thumb.css">
<style>
  .page { position: absolute; inset: 0; padding: 52px 72px 48px; display: flex; flex-direction: column; }
  .topic-box { flex: 1; display: flex; align-items: center; min-height: 0; margin: 20px 0; }
  [data-topic] { width: 100%; }
  ol { list-style: none; display: flex; gap: 44px; border-top: 2px solid var(--rule); padding-top: 22px; }
  li { font-size: 42px; font-weight: 600; text-decoration: underline; text-decoration-color: var(--red);
       text-decoration-thickness: 3px; text-underline-offset: 0.25em; }
  li::before { content: '✓ '; color: var(--red); text-decoration: none; display: inline-block; margin-right: 8px; }
</style></head>
<body><div class="page">
  <div class="brand"><svg viewBox="0 0 100 102" aria-hidden="true"><polygon points="0,0 92,0 92,70 40,70 14,94 14,70 0,70" fill="var(--bubble, #1d1a16)"/><polygon points="22,25 32,35 22,45 12,35" fill="var(--mark, #f3eee2)"/><polygon points="46,25 56,35 46,45 36,35" fill="#b8281c"/><polygon points="70,25 80,35 70,45 60,35" fill="var(--mark, #f3eee2)"/></svg><span>irticalen<span class="dot">.</span></span></div>
  <div class="topic-box"><span data-topic data-max="190"></span></div>
  <ol><li data-arc="0"></li><li data-arc="1"></li><li data-arc="2"></li></ol>
</div><script src="thumb.js"></script></body></html>
